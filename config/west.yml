# ブランチ名やタグで参照しないのは(タグは付け替え可能)、上流が乗っ取られたときに
# west update だけで不正なコードがファームウェアに入るため。SHA を上げるときは
# 差分をレビューしてから: git -C <repo> log --oneline <古いSHA>..<新しいSHA>
#
# zmk が import する Zephyr までは固定できていない。塞ぐには zmk の manifest ごと
# 管理下に置く必要があり、そこまではやっていない。
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: beekeeb
      url-base: https://github.com/beekeeb
    - name: odaryo
      url-base: https://github.com/odaryo
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
      revision: edf5c0814fd3ea202e43aad2d68fd32e882a518c # tag v0.3
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: 8756cb7b8114069fa3c25c6f6c990f24988fceff # tag v0.3
    # 上流(beekeeb)をそのまま使わないのは、エッジスクロール用の report-absolute が
    # 無いため。分岐元は beekeeb main = c329f30。デフォルトブランチの master には
    # three-finger-swipe が入っていないので、そちらには戻さないこと。
    - name: zmk_driver_azoteq
      remote: odaryo
      revision: 57b4da9e70a1c0358020864f02f64e584ac415e8 # toucan-edge-scroll
    - name: zmk-input-zoom
      remote: beekeeb
      revision: 91bbe0c0e02145da50c9df798489479d28be1804 # main @ 2026-08-11
  self:
    path: config
